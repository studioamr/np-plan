<head>

<title>NORTHPOINT · App</title>

<!--
  APP NORTHPOINT v6 · 30-sep-2026 · rediseño profesional con dos vistas:
  CLIENTE (dashboard, movimientos, mesa, metas, cuenta) y MESA/EQUIPO (resumen, clientes, riesgo, sesión, prospectos).
  MODO DEMOSTRACIÓN: datos de ejemplo generados en el navegador (localStorage). No mueve dinero real.
  En computadora: barra lateral. En celular o dentro del iPhone de la landing: pestañas abajo.
  Respaldo de la versión anterior: img/orig/app-v5-respaldo.html (no se publica).

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA; --card:#FFFFFF; --ink:#0B1220; --mut:#64708A; --dim:#98A2B8; --line:#E6EAF2; --soft:#F7F9FD;
  --navy:#0B1B3F; --blue:#2251FF; --blue2:#5B7CFF; --sky:#E8EEFF;
  --green:#12A150; --greenS:#E7F7EE; --red:#E5484D; --redS:#FDECEC; --amber:#F59E0B; --amberS:#FEF3DC;
  --teal:#0EA5A4; --violet:#7C5CFF;
  --f:"Inter",system-ui,-apple-system,sans-serif; --r:18px; --sh:0 1px 2px rgba(11,18,32,.04),0 8px 24px -12px rgba(11,18,32,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.g{color:var(--green)} .r{color:var(--red)} .b{color:var(--blue)} .m{color:var(--mut)}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:22px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:14px;padding:4px 10px 22px}
.logo svg{width:18px;height:18px}
.mode{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.08);border-radius:12px;padding:4px;margin:0 4px 18px}
.mode button{padding:8px 0;border-radius:9px;font-size:13px;font-weight:600;color:rgba(255,255,255,.65)}
.mode button.on{background:#fff;color:var(--navy)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-size:14px;font-weight:500;color:rgba(255,255,255,.72);text-align:left;transition:background .2s,color .2s}
.nav button svg{width:19px;height:19px;flex:0 0 19px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(91,124,255,.22);color:#fff}
.nav button .dotn{margin-left:auto;background:var(--amber);color:var(--navy);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;display:grid;gap:12px}
.demo-tag{font-size:11px;color:rgba(255,255,255,.55);padding:0 10px;line-height:1.5}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;flex:0 0 36px}
.me b{display:block;font-size:13px}.me span{display:block;font-size:11.5px;color:rgba(255,255,255,.6)}
.main{min-width:0;padding:26px 32px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.top p{font-size:14px;color:var(--mut);margin-top:3px}
.top-act{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .15s,box-shadow .2s,background .2s}
.btn svg{width:17px;height:17px}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 8px 20px -8px rgba(34,81,255,.6)}
.btn-p:hover{background:#1B43E0}
.btn-s{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn-w{background:#fff;color:var(--navy)}
.btn-gl{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22)}
.btn[disabled]{opacity:.4;pointer-events:none}
.mtop,.tabs{display:none}
.grid{display:grid;gap:18px}
.g12{grid-template-columns:repeat(12,1fr)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px;min-width:0}
.card h3{font-size:15px;font-weight:600}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lbl{font-size:12.5px;color:var(--mut);font-weight:500}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.sub{font-size:12.5px;color:var(--mut);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.g{background:var(--greenS);color:var(--green)} .pill.r{background:var(--redS);color:var(--red)} .pill.a{background:var(--amberS);color:#B45309} .pill.b{background:var(--sky);color:var(--blue)} .pill.n{background:var(--soft);color:var(--mut)}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#0B1B3F 0%,#1A3A8F 58%,#2251FF 100%);box-shadow:0 20px 40px -20px rgba(34,81,255,.55)}
.hero .star{position:absolute;right:-50px;top:-50px;width:260px;height:260px;color:rgba(255,255,255,.07)}
.hero .lbl{color:rgba(255,255,255,.72)}
.hero .saldo{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:8px 0 10px}
.hero .saldo small{font-size:22px;opacity:.6;font-weight:600}
.hero .chip{display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.14);font-size:13px;font-weight:600}
.hero .chip i{font-style:normal;color:#7CF0B0}
.hero .chip.neg i{color:#FFB3B3}
.hero .acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.hero .meta{display:grid;grid-template-columns:repeat(3,auto);gap:26px;margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.15);justify-content:start}
.hero .meta span{display:block;font-size:11.5px;color:rgba(255,255,255,.65)}
.hero .meta b{display:block;font-size:16px;margin-top:3px}
.ranges{display:flex;gap:4px;background:var(--soft);border-radius:10px;padding:3px}
.ranges button{padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--mut)}
.ranges button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,18,32,.1)}
.chart{position:relative;width:100%;height:220px}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-125%);opacity:0;transition:opacity .15s}
.ring{position:relative;width:118px;height:118px;flex:0 0 118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:22px;font-weight:800}
.ring .c span{display:block;font-size:11px;color:var(--mut)}
.goalrow{display:flex;gap:18px;align-items:center}
.kpi{display:flex;gap:12px;align-items:flex-start}
.kic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 40px;font-size:14px}
.kic svg{width:20px;height:20px}
.kic.g{background:var(--greenS);color:var(--green)} .kic.b{background:var(--sky);color:var(--blue)} .kic.v{background:#F0ECFF;color:var(--violet)} .kic.a{background:var(--amberS);color:#B45309} .kic.t{background:#E3F7F6;color:var(--teal)} .kic.r{background:var(--redS);color:var(--red)}
.list{list-style:none}
.list li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0;padding-top:2px}
.list .t{font-size:14px;font-weight:600}.list .d{font-size:12.5px;color:var(--mut);margin-top:2px}
.list .v{font-size:14px;font-weight:700;text-align:right}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--blue2))}
.bar.a i{background:linear-gradient(90deg,#F59E0B,#FBBF24)} .bar.r i{background:linear-gradient(90deg,#E5484D,#F87171)} .bar.g i{background:linear-gradient(90deg,#12A150,#34D399)}
.planc{border-radius:14px;padding:14px 16px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.dotp{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}
.link{font-size:13px;font-weight:600;color:var(--blue)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
.tb td{padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb tr:hover td{background:var(--soft)}
.tb .nm{display:flex;align-items:center;gap:10px;font-weight:600}
.tb .av{width:30px;height:30px;flex-basis:30px;font-size:11px}
.search{height:40px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:500 14px var(--f);background:var(--card);min-width:220px;outline:none}
.search:focus{border-color:var(--blue)}
.tbwrap{overflow-x:auto}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.ldot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.ldot.on{background:var(--green);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(18,161,80,.45)}70%{box-shadow:0 0 0 9px rgba(18,161,80,0)}100%{box-shadow:0 0 0 0 rgba(18,161,80,0)}}
.view{animation:in .35s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{padding:28px;text-align:center;color:var(--mut);font-size:14px}
.note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.5}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(11,27,63,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.scrim.on{display:flex}
.sheet{background:#fff;border-radius:22px;width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:26px;box-shadow:0 30px 60px -20px rgba(11,18,32,.4);animation:in .3s}
.sheet h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:10px 0 6px}
.sheet p{font-size:14px;color:var(--mut)}
.amount{display:flex;align-items:baseline;justify-content:center;gap:4px;margin:24px 0 10px}
.amount span{font-size:30px;font-weight:600;color:var(--dim)}
.amount input{width:100%;max-width:240px;border:0;text-align:center;font:800 46px var(--f);letter-spacing:-.03em;outline:none;color:var(--ink)}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.quick button{padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;background:var(--soft);border:1px solid var(--line)}
.field{display:grid;gap:7px;margin-top:14px;font-size:13px;font-weight:600;color:var(--mut)}
.field input{height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:500 15px var(--f);color:var(--ink);outline:none;background:#fff}
.field input:focus{border-color:var(--blue)}
.err{color:var(--red);font-size:13px;text-align:center;min-height:18px}
.btns{display:grid;gap:10px;margin-top:10px}
.plans{display:grid;gap:10px;margin:16px 0}
.pl{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.pl.on{border-color:var(--blue);box-shadow:0 0 0 4px rgba(34,81,255,.12)}
.pl .row{display:flex;justify-content:space-between;align-items:center}
.pl b{font-size:15px}.pl .o{font-size:20px;font-weight:800}
.pl .s{font-size:12.5px;color:var(--mut);margin-top:4px}
.welcome{position:fixed;inset:0;z-index:70;background:linear-gradient(160deg,#0B1B3F 0%,#1A3A8F 60%,#2251FF 100%);color:#fff;display:none;align-items:center;justify-content:center;padding:24px;overflow:auto}
.welcome.on{display:flex}
.wbox{max-width:420px;width:100%}
.wbox .star{width:54px;height:54px;color:#fff;margin-bottom:24px}
.wbox h1{font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.wbox p{font-size:15.5px;opacity:.82;margin:14px 0 24px;line-height:1.55}
.wbox .btn{height:50px;font-size:15px}
.wbox .field{color:rgba(255,255,255,.8)}
.wfine{font-size:12px;opacity:.6;margin-top:18px;text-align:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:95;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:980px){
  .shell{display:block}
  .side{display:none}
  .main{padding:calc(env(safe-area-inset-top) + 70px) 14px 100px}
  .mtop{display:flex;position:fixed;top:0;left:0;right:0;z-index:40;height:calc(env(safe-area-inset-top) + 58px);padding:env(safe-area-inset-top) 16px 0;align-items:center;justify-content:space-between;background:rgba(243,245,250,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .mtop .logo{color:var(--navy);padding:0}
  .mtop .mode{margin:0;background:#fff;border:1px solid var(--line)}
  .mtop .mode button{color:var(--mut);padding:6px 12px;font-size:12px}
  .mtop .mode button.on{background:var(--navy);color:#fff}
  .tabs{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:40;grid-auto-flow:column;grid-auto-columns:1fr;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--dim);padding:6px 0}
  .tabs button svg{width:22px;height:22px}
  .tabs button.on{color:var(--blue)}
  .top{margin-bottom:14px}.top h1{font-size:22px}
  .top-act .btn-s{display:none}
  .top-act{display:none}
  .grid{gap:12px}
  .g12>*{grid-column:span 12!important}
  .card{padding:16px}
  .hero .saldo{font-size:38px}
  .hero .meta{gap:14px;grid-template-columns:repeat(3,1fr)}
  .chart{height:180px}
  .search{min-width:0;width:100%}
}
</style>
</head>

<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gArea" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2251FF" stop-opacity=".28"/><stop offset="1" stop-color="#2251FF" stop-opacity="0"/></linearGradient>
<linearGradient id="gLine" x1="0" x2="1"><stop offset="0" stop-color="#5B7CFF"/><stop offset="1" stop-color="#2251FF"/></linearGradient>
<linearGradient id="gRing" x1="0" x2="1"><stop offset="0" stop-color="#2251FF"/><stop offset="1" stop-color="#12A150"/></linearGradient></defs>

<div class="shell">
  <aside class="side">
    <div class="logo"><svg><use href="#star"/></svg>NORTHPOINT</div>
    <div class="mode"><button data-mode="cliente" class="on">Cliente</button><button data-mode="mesa">Mesa</button></div>

<script>
// ═════════════ configuración ═════════════
const CONFIG = {
  planes: [
    { id:"bas", nombre:"Básico",   color:"#0EA5A4", objetivo:1.5, riesgo:1.5, lema:"Estabilidad primero" },
    { id:"mod", nombre:"Moderado", color:"#2251FF", objetivo:3,   riesgo:3,   lema:"Crecimiento equilibrado" },
    { id:"agr", nombre:"Agresivo", color:"#7C5CFF", objetivo:6,   riesgo:6,   lema:"Máximo potencial" }
  ],
  niveles: [ { nombre:"Inicial", min:100, fee:30 }, { nombre:"Plus", min:1000, fee:25 }, { nombre:"Privado", min:10000, fee:20 } ],
  traders: ["André Macouzet", "Pablo Ochoa", "Gerardo Andaluz"],
  KEY: "np-app-v6", minimo: 100
};
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const usd = (n, d=2) => (n<0?"−":"") + "$" + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const usd0 = n => usd(n,0);
const pct = (n, d=1) => (n>=0?"+":"−") + Math.abs(n).toFixed(d) + "%";
const sg = n => n>=0 ? "+" : "";
const planDe = id => CONFIG.planes.find(p=>p.id===id) || CONFIG.planes[1];
const nivelDe = s => CONFIG.niveles.slice().reverse().find(n => s >= n.min) || CONFIG.niveles[0];
const ini = n => n.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const fecha = d => `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;
const Mes = i => MESES[i].charAt(0).toUpperCase() + MESES[i].slice(1);
function rng(seed){ let t = seed>>>0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t>>>15, 1|t); r ^= r + Math.imul(r ^ r>>>7, 61|r); return ((r ^ r>>>14)>>>0)/4294967296; }; }
function normal(r){ let u=0,v=0; while(!u) u=r(); while(!v) v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const I = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICO = {

function crearCuenta(nombre, plan, monto, seed){
  const p = planDe(plan), r = rng(seed || Date.now()%1e9), hoy = new Date(), N = 12;
  const movs = []; let bal = monto, hwm = monto;
  const alta = new Date(hoy.getFullYear(), hoy.getMonth()-N, 4, 10);
  movs.push({ tipo:"dep", fecha:alta.toISOString(), monto, nota:"Depósito inicial" });
  for(let k=N; k>=1; k--){
    const fin = new Date(hoy.getFullYear(), hoy.getMonth()-k+1, 0, 18);
    if(k===8 || k===4){ const d = Math.max(50, Math.round(monto*(.25+r()*.25)/50)*50); movs.push({ tipo:"dep", fecha:new Date(fin.getFullYear(), fin.getMonth(), 12).toISOString(), monto:d, nota:"Depósito" }); bal += d; hwm += d; }
    const ret = Math.max(p.objetivo*.75 + p.riesgo*.75*normal(r), -p.riesgo);
    const antes = bal; bal *= 1 + ret/100;
    movs.push({ tipo:"res", fecha:fin.toISOString(), monto:bal-antes, pct:ret, mes:fin.getMonth(), anio:fin.getFullYear() });
    if(bal > hwm){ const fee = nivelDe(antes).fee, f = (bal-hwm)*fee/100; bal -= f; hwm = bal; movs.push({ tipo:"fee", fecha:new Date(fin.getTime()+6e4).toISOString(), monto:-f, nota:`${fee}% de la ganancia de ${MESES[fin.getMonth()]}` }); }
  }
  const frac = Math.min(1, hoy.getDate()/30), retMes = Math.max(p.objetivo*.7 + p.riesgo*.5*normal(r), -p.riesgo)*frac;
  const ops = []; const n = 6 + Math.floor(r()*6); let rest = bal*retMes/100;
  for(let i=0;i<n;i++){
    const dia = Math.max(1, Math.round((i+1)/n*Math.max(1,hoy.getDate()-1)));
    const share = i===n-1 ? rest : rest/(n-i) + (r()-.5)*bal*p.riesgo/100*.5; rest -= share;
    ops.push({ fecha:new Date(hoy.getFullYear(), hoy.getMonth(), dia, 8+Math.floor(r()*5), Math.floor(r()*59)).toISOString(), inst: r()>.5?"Nasdaq 100":"S&P 500", dir: r()>.45?"Compra":"Venta", monto:share, trader: CONFIG.traders[Math.floor(r()*3)] });
  }
  S = { nombre, plan, creado:alta.toISOString(), movs, ops,
    metas:[ { nombre:"Enganche de casa", objetivo:Math.max(2000, Math.round(monto*2.5/1000)*1000), color:"#2251FF" }, { nombre:"Fondo de emergencia", objetivo:Math.max(1000, Math.round(monto*1.1/500)*500), color:"#12A150" } ],
    notif:{ resultados:true, operaciones:false, freno:true }, dosPasos:false };
  save();
}
const opsMes = () => S.ops.reduce((a,o)=>a+o.monto,0);
const saldo = () => S.movs.reduce((a,m)=>a+m.monto,0) + opsMes();
const depositado = () => S.movs.filter(m=>m.tipo==="dep"||m.tipo==="ret").reduce((a,m)=>a+m.monto,0);
const comisiones = () => -S.movs.filter(m=>m.tipo==="fee").reduce((a,m)=>a+m.monto,0);
const resultados = () => S.movs.filter(m=>m.tipo==="res").sort((a,b)=>a.fecha<b.fecha?-1:1);
function serie(){ const pts = []; let acc = 0; [...S.movs].sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(m => { acc += m.monto; pts.push({ t:new Date(m.fecha), v:acc }); }); pts.push({ t:new Date(), v:saldo() }); return pts; }
function cumOps(){ let a = 0; return [...S.ops].sort((x,y)=>x.fecha<y.fecha?-1:1).map(o => a += o.monto); }
function uso(){ const p = planDe(S.plan), base = saldo()-opsMes(), worst = Math.min(0, ...cumOps()); return Math.min(1, Math.abs(worst)/base*100/p.riesgo); }

function area(el, pts, fmt){
  if(!el) return;

  if(pts.length < 2){ el.innerHTML = `<div class="empty">Sin datos todavía</div>`; return; }
  const t0 = +pts[0].t, t1 = +pts[pts.length-1].t, vs = pts.map(p=>p.v), lo = Math.min(...vs)*.97, hi = Math.max(...vs)*1.02;
  const x = t => pl + (t-t0)/((t1-t0)||1)*(W-pl-pr), y = v => pt + (1-(v-lo)/((hi-lo)||1))*(H-pt-pb);
  const d = pts.map((p,i)=>`${i?"L":"M"}${x(+p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const ticks = [0,.25,.5,.75,1].map(f => new Date(t0 + (t1-t0)*f));
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${pt+f*(H-pt-pb)}" y2="${pt+f*(H-pt-pb)}" stroke="#EEF1F7" vector-effect="non-scaling-stroke"/>`).join("")}
    <path d="${d}L${x(t1)},${H-pb}L${x(t0)},${H-pb}Z" fill="url(#gArea)"/>
    <path class="ln" d="${d}" fill="none" stroke="url(#gLine)" stroke-width="2.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="cx" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="#2251FF" stroke-dasharray="3 3" opacity="0" vector-effect="non-scaling-stroke"/>
    ${ticks.map((t,i)=>`<text x="${i===0?pl:i===4?W-pr:x(+t)}" y="${H-6}" font-size="11" fill="#98A2B8" text-anchor="${i===0?"start":i===4?"end":"middle"}">${fecha(t)}</text>`).join("")}
  </svg><div class="tip"></div><div class="cdot" style="position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #2251FF;transform:translate(-50%,-50%);opacity:0;pointer-events:none"></div>`;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cx = el.querySelector(".cx"), cd = el.querySelector(".cdot"), path = el.querySelector(".ln");
  try{ const L = path.getTotalLength(); path.style.strokeDasharray = L; path.style.strokeDashoffset = L; requestAnimationFrame(()=>{ path.style.transition = "stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)"; path.style.strokeDashoffset = 0; }); }catch(_){}
  const show = cxp => { const r = svg.getBoundingClientRect(), fx = (cxp - r.left)/r.width*W, tt = t0 + (fx-pl)/(W-pl-pr)*(t1-t0);
    let best = pts[0]; for(const p of pts) if(Math.abs(+p.t-tt) < Math.abs(+best.t-tt)) best = p;
    const X = x(+best.t), Y = y(best.v); cx.setAttribute("x1",X); cx.setAttribute("x2",X); cx.setAttribute("opacity",.6);
    cd.style.left = (X/W*100)+"%"; cd.style.top = (Y/H*100)+"%"; cd.style.opacity = 1;
    tip.style.left = (X/W*100)+"%"; tip.style.top = (Y/H*100)+"%"; tip.style.opacity = 1; tip.textContent = `${fmt(best.v)} · ${fecha(best.t)}`; };
  el.onmousemove = e => show(e.clientX); el.ontouchmove = e => show(e.touches[0].clientX);
  el.onmouseleave = () => { tip.style.opacity = 0; cx.setAttribute("opacity",0); cd.style.opacity = 0; };
}
function bars(el, items){
  const W = 640, H = 200, pb = 24, mx = Math.max(...items.map(i=>Math.abs(i.v)), 1), mid = (H-pb)/2, bw = (W/items.length)*.56;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="#E6EAF2" vector-effect="non-scaling-stroke"/>
    ${items.map((it,i)=>{ const h = Math.abs(it.v)/mx*(mid-8), X = (i+.5)*(W/items.length) - bw/2; return `<rect class="bb" x="${X}" y="${it.v>=0?mid-h:mid}" width="${bw}" height="${h}" rx="4" fill="${it.v>=0?"#12A150":"#E5484D"}" style="transform-origin:${X+bw/2}px ${mid}px"><title>${it.l}: ${pct(it.v)}</title></rect>
    <text x="${X+bw/2}" y="${H-6}" font-size="11" fill="#98A2B8" text-anchor="middle">${it.l}</text>`; }).join("")}</svg>`;

  const pts = cut ? all.filter(p => now - +p.t <= cut*864e5) : all;
  area($("#chGrow"), pts.length>1 ? pts : all.slice(-2), v=>usd(v));
  $$("#ranges button").forEach(b=>b.onclick=()=>{ RANGO = b.dataset.r; $$("#ranges button").forEach(x=>x.classList.toggle("on", x===b)); drawGrow(); });
}

// ═════════════ hojas ═════════════
function sheet(tipo, arg){
  const sh = $("#sheet"), bal = S ? saldo() : 0;
  if(tipo==="delmeta"){ S.metas.splice(+arg,1); save(); render(); toast("Meta eliminada"); return; }
  if(tipo==="doc"){ toast("En la app real descargará su estado de cuenta en PDF"); return; }
  if(tipo==="dep" || tipo==="ret"){
    const dep = tipo==="dep";
    sh.innerHTML = `<span class="pill ${dep?"b":"n"}">${dep?"Depositar":"Retirar"}</span><h2>${dep?"Agregue a su ahorro":"Retire cuando quiera"}</h2>
      <p>${dep?"Va directo a su cuenta y la mesa lo empieza a operar.":`Disponible ${usd(bal)}. Sin plazos ni penalizaciones.`}</p>
      <label class="amount"><span>$</span><input id="amt" inputmode="decimal" placeholder="0"></label>
      <div class="quick">${(dep?[100,250,500,1000]:[100,500,"Todo"]).map(v=>`<button data-q="${v}">${v==="Todo"?"Todo":usd0(v)}</button>`).join("")}</div>
      <div class="err" id="err"></div>
      <div class="btns"><button class="btn btn-p" id="ok" disabled>${dep?"Depositar":"Retirar"}</button><button class="btn btn-s" id="cancel">Cancelar</button></div>
      <p class="note">Demostración: no se mueve dinero real. En la app real, el dinero va de su banco a su propia cuenta y NORTHPOINT nunca lo recibe.</p>`;
    const a = $("#amt"), ok = $("#ok"), val = () => parseFloat((a.value||"").replace(/[^0-9.]/g,""))||0;
    const chk = () => { const v = val(), m = v>0 && !dep && v>bal ? `No puede retirar más de ${usd(bal)}.` : ""; $("#err").textContent = m; ok.disabled = v<=0 || !!m; };
    a.oninput = chk; sh.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ a.value = b.dataset.q==="Todo" ? bal.toFixed(2) : b.dataset.q; chk(); });
    ok.onclick = () => { const v = Math.min(val(), dep?Infinity:bal); S.movs.push({ tipo:dep?"dep":"ret", fecha:new Date().toISOString(), monto:dep?v:-v, nota:dep?"Depósito":"" }); save(); close(); render(); buildNav(); toast(`${dep?"Depósito":"Retiro"} de ${usd(v)} registrado · demo`); };
    $("#cancel").onclick = close; setTimeout(()=>a.focus(), 60);
  }
  if(tipo==="plan"){
    let sel = S.plan;
    sh.innerHTML = `<span class="pill b">Plan</span><h2>Elija su objetivo</h2><p>Aplica desde la próxima sesión. El objetivo es una meta, no una garantía.</p>
      <div class="plans">${CONFIG.planes.map(p=>`<button class="pl ${p.id===sel?"on":""}" data-pl="${p.id}"><div class="row"><b><span class="dotp" style="background:${p.color}"></span>${p.nombre}</b><span class="o" style="color:${p.color}">+${p.objetivo}%</span></div><div class="s">${p.lema} · riesgo mensual ${p.riesgo}% · +${(p.objetivo*12).toFixed(0)}% al año</div></button>`).join("")}</div>
      <div class="btns"><button class="btn btn-p" id="ok">Guardar plan</button><button class="btn btn-s" id="cancel">Cancelar</button></div>`;
    sh.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{ sel = b.dataset.pl; sh.querySelectorAll("[data-pl]").forEach(x=>x.classList.toggle("on", x===b)); });
    $("#ok").onclick = () => { S.plan = sel; save(); close(); render(); buildNav(); toast(`Plan ${planDe(sel).nombre} activo`); }; $("#cancel").onclick = close;
  }
  if(tipo==="meta"){
    const cols = ["#2251FF","#12A150","#7C5CFF","#F59E0B","#0EA5A4"];
    sh.innerHTML = `<span class="pill b">Nueva meta</span><h2>¿Para qué está ahorrando?</h2>
      <label class="field">Nombre de la meta<input id="mn" placeholder="Ej. viaje, retiro, auto"></label>
      <label class="field">¿Cuánto necesita? (USD)<input id="mo" inputmode="decimal" placeholder="5,000"></label>
      <div class="btns" style="margin-top:18px"><button class="btn btn-p" id="ok">Crear meta</button><button class="btn btn-s" id="cancel">Cancelar</button></div>`;
    $("#ok").onclick = () => { const n = $("#mn").value.trim(), o = parseFloat($("#mo").value.replace(/[^0-9.]/g,"")); if(!n || !o) return;
      S.metas.push({ nombre:n, objetivo:o, color:cols[S.metas.length%cols.length] }); save(); close(); render(); toast("Meta creada"); }; $("#cancel").onclick = close;
  }
  $("#scrim").classList.add("on");
}
function close(){ $("#scrim").classList.remove("on"); }
$("#scrim").addEventListener("click", e => { if(e.target.id==="scrim") close(); });
addEventListener("keydown", e => { if(e.key==="Escape") close(); });
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("on"), 2400); }

// ═════════════ bienvenida ═════════════
function welcome(){
  const w = $("#welcome"), b = $("#wbox"); w.classList.add("on");
  const O = { paso:0, nombre:"", plan:"mod", monto:1000 };
  function paint(){
    if(O.paso===0) b.innerHTML = `<svg class="star"><use href="#star"/></svg><h1>Su ahorro, trabajando cada mes.</h1>
      <p>Vea su saldo, el objetivo de su plan y cada operación de la mesa. Desde $${CONFIG.minimo} dólares.</p>
      <div class="btns"><button class="btn btn-w" id="demo">Ver la demo con datos</button><button class="btn btn-gl" id="crear">Crear mi cuenta de prueba</button></div>
      <p class="wfine">Demostración: no se pide ni se mueve dinero real.</p>`;
    if(O.paso===1) b.innerHTML = `<h1 style="font-size:30px">¿Cómo se llama?</h1><p>Para personalizar su demo.</p>
      <label class="field">Nombre y apellido<input id="nm" value="${O.nombre}" autocomplete="name"></label>
      <div class="btns" style="margin-top:18px"><button class="btn btn-w" id="next">Continuar</button><button class="btn btn-gl" id="back">Atrás</button></div>`;
    if(O.paso===2) b.innerHTML = `<h1 style="font-size:30px">Elija su plan</h1><p>Puede cambiarlo cuando quiera.</p>
      <div class="plans">${CONFIG.planes.map(p=>`<button class="pl ${p.id===O.plan?"on":""}" data-pl="${p.id}"><div class="row"><b><span class="dotp" style="background:${p.color}"></span>${p.nombre}</b><span class="o" style="color:${p.color}">+${p.objetivo}%</span></div><div class="s">${p.lema} · riesgo ${p.riesgo}% al mes</div></button>`).join("")}</div>
      <div class="btns"><button class="btn btn-w" id="next">Continuar</button><button class="btn btn-gl" id="back">Atrás</button></div>`;
    if(O.paso===3) b.innerHTML = `<h1 style="font-size:30px">¿Con cuánto empieza?</h1><p>Desde $${CONFIG.minimo} USD.</p>
      <label class="field">Monto inicial (USD)<input id="mt" inputmode="decimal" value="${O.monto}"></label>
      <div class="btns" style="margin-top:18px"><button class="btn btn-w" id="next">Abrir mi cuenta demo</button><button class="btn btn-gl" id="back">Atrás</button></div>`;
    const d = $("#demo"), c = $("#crear"), n = $("#next"), bk = $("#back");
    if(d) d.onclick = () => { crearCuenta("Mariana López","mod",12400,20260929); finish(); };
    if(c) c.onclick = () => { O.paso = 1; paint(); };
    if(bk) bk.onclick = () => { O.paso--; paint(); };
    b.querySelectorAll("[data-pl]").forEach(x=>x.onclick=()=>{ O.plan = x.dataset.pl; b.querySelectorAll("[data-pl]").forEach(y=>y.classList.toggle("on", y===x)); });
    if(n) n.onclick = () => {
      if(O.paso===1){ O.nombre = $("#nm").value.trim(); if(!O.nombre) return; }
      if(O.paso===3){ O.monto = parseFloat($("#mt").value.replace(/[^0-9.]/g,""))||0; if(O.monto < CONFIG.minimo){ toast(`El mínimo es $${CONFIG.minimo}`); return; } crearCuenta(O.nombre, O.plan, O.monto); finish(); return; }
      O.paso++; paint(); };
  }
  function finish(){ w.classList.remove("on"); setMode("cliente"); toast("Cuenta demo lista"); }
  paint();
}

// ═════════════ arranque ═════════════
load();
if(!S || !S.movs){ if(MUESTRA){ crearCuenta("Mariana López","mod",12400,20260929); setMode("cliente"); } else welcome(); }
else { let st = ["cliente","inicio"]; try{ st = (sessionStorage.getItem("np6")||"cliente|inicio").split("|"); }catch(_){}
  MODE = NAV[st[0]] ? st[0] : "cliente"; go(VIEWS[st[1]] && NAV[MODE].some(x=>x[0]===st[1]) ? st[1] : NAV[MODE][0][0]); }
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(()=>{ if(VIEW==="inicio") drawGrow(); if(VIEW==="resumen") afterResumen(); }, 200); });
</script>
