# Plantilla de GitHub Action: actualiza data/*.json (noticias, memos, calendario, videos, Polymarket) cada hora.
# Para activarla: `gh auth refresh -s workflow` y copiar este archivo a .github/workflows/actualizar-datos.yml
name: Actualizar datos del Coffee Morning
on:
  schedule: [{ cron: "15 * * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 herramientas/noticias.py
      - run: |
          git config user.name "NORTHPOINT bot"; git config user.email "bot@northpointcapital.io"
          git add data/*.json && git commit -m "Datos del Coffee Morning" && git push || echo "sin cambios"
